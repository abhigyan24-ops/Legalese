<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#132A20" />
  <circle cx="256" cy="256" r="210" fill="#1D3C2C" stroke="#F5B942" stroke-width="12" stroke-dasharray="16 8" />
  <circle cx="256" cy="256" r="180" fill="#25493A" />
  <!-- Central Scales of Justice in Gold -->
  <g transform="translate(256, 256) scale(1.4)">
    <!-- Base -->
    <path d="M-60,70 L60,70 L40,60 L-40,60 Z" fill="#F5B942" />
    <rect x="-6" y="-70" width="12" height="135" rx="6" fill="#F5B942" />
    <circle cx="0" cy="-75" r="12" fill="#FFE7A8" stroke="#F5B942" stroke-width="4" />
    <!-- Beam -->
    <path d="M-85,-65 L85,-65" stroke="#F5B942" stroke-width="8" stroke-linecap="round" />
    <!-- Left Pan -->
    <line x1="-75" y1="-65" x2="-95" y2="-10" stroke="#FFE7A8" stroke-width="3" />
    <line x1="-75" y1="-65" x2="-55" y2="-10" stroke="#FFE7A8" stroke-width="3" />
    <path d="M-105,-10 Q-75,15 -45,-10 Z" fill="#F5B942" />
    <!-- Right Pan -->
    <line x1="75" y1="-65" x2="55" y2="-10" stroke="#FFE7A8" stroke-width="3" />
    <line x1="75" y1="-65" x2="95" y2="-10" stroke="#FFE7A8" stroke-width="3" />
    <path d="M45,-10 Q75,15 105,-10 Z" fill="#F5B942" />
    <!-- Star Emblem -->
    <polygon points="0,-25 6,-10 22,-10 10,0 14,16 0,6 -14,16 -10,0 -22,-10 -6,-10" fill="#FFE7A8" />
  </g>
  <text x="256" y="440" text-anchor="middle" fill="#FFE7A8" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" letter-spacing="4">RIGHTS QUEST</text>
</svg>
